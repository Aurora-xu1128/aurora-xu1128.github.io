  <style>
:root {
  color-scheme: light;
  --ink: #4b5055;
  --muted: #72777c;
  --line: #edf0f2;
  --accent: #376d8a;
  --page-width: 1280px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body {
  margin: 0;
  background: #fff;
  color: var(--ink);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
a:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 5px;
  border-radius: 2px;
}
[hidden] { display: none !important; }
.skip-link {
  position: fixed;
  top: -80px;
  left: 12px;
  z-index: 100;
  padding: 8px 14px;
  background: #fff;
  border: 1px solid var(--accent);
}
.skip-link:focus { top: 8px; }
.masthead {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(255, 255, 255, .98);
  border-bottom: 1px solid var(--line);
}
.navigation {
  max-width: var(--page-width);
  min-height: 58px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 44px;
}
.home-link { font-weight: 650; }
.navigation a {
  color: var(--muted);
  text-decoration: none;
  white-space: nowrap;
  font-size: 15px;
}
.navigation-links {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  column-gap: 30px;
  row-gap: 6px;
  padding: 12px 0;
}
.navigation-links a {
  text-underline-offset: 8px;
  text-decoration-thickness: 1px;
}
.navigation-links a:hover,
.navigation-links a[aria-current="location"] {
  color: var(--ink);
  text-decoration: underline;
}
.menu-toggle {
  display: none;
  border: 0;
  background: transparent;
  padding: 7px;
  color: var(--ink);
  cursor: pointer;
}
.menu-toggle svg {
  display: block;
  width: 23px;
  height: 23px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
}
.page-layout {
  max-width: var(--page-width);
  margin: 0 auto;
  padding: 40px 20px 28px;
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  align-items: start;
  column-gap: 40px;
}
.profile {
  position: sticky;
  top: 100px;
  min-width: 0;
}
.profile-avatar {
  display: block;
  width: 164px;
  height: 164px;
  border: 1px solid var(--line);
  border-radius: 50%;
  object-fit: cover;
}
.profile-name {
  margin: 18px 0 20px;
  color: #41464c;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -.35px;
}
.profile-links { list-style: none; padding: 0; margin: 0; }
.profile-links li + li { margin-top: 10px; }
.profile-links a {
  display: flex;
  align-items: center;
  gap: 9px;
  width: fit-content;
  max-width: 100%;
  font-size: 14px;
  text-decoration: none;
  overflow-wrap: anywhere;
}
.profile-links a:hover { color: var(--accent); text-decoration: underline; }
.profile-links svg {
  flex: 0 0 15px;
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linejoin: round;
}
.profile-links .github-icon { fill: currentColor; stroke: none; }
.main-content { min-width: 0; }
.content-section { scroll-margin-top: 80px; min-height: 112px; }
.content-section h2 {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--line);
  font-size: 22px;
  line-height: 1.4;
  font-weight: 650;
  letter-spacing: -.25px;
}
.content-section h2 span { font-size: 21px; line-height: 1; }
.section-body { min-height: 58px; padding-top: 15px; }
.section-body p { margin: 0 0 14px; }
.section-body ul { margin: 0 0 14px; padding-left: 25px; }
.section-body a { color: var(--accent); }
.page-footer {
  margin-top: 10px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  color: #8b9095;
  font-size: 12px;
}

@media (max-width: 1060px) {
  .navigation { gap: 28px; }
  .navigation-links { column-gap: 20px; }
  .page-layout { grid-template-columns: 200px minmax(0, 1fr); column-gap: 30px; }
}
@media (max-width: 760px) {
  html { scroll-padding-top: 78px; }
  .navigation { flex-wrap: wrap; justify-content: space-between; gap: 0; }
  .home-link { display: inline-flex; align-items: center; min-height: 58px; }
  .menu-toggle { display: block; }
  .navigation-links { flex: 0 0 100%; padding: 0 0 14px; gap: 13px 24px; }
  .navigation.menu-ready .navigation-links { display: none; }
  .navigation.menu-open .navigation-links { display: flex; }
  .navigation-links a { padding: 4px 0; }
  .page-layout { display: block; padding: 28px 22px; }
  .profile {
    position: static;
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 38px;
  }
  .profile-avatar { flex: 0 0 98px; width: 98px; height: 98px; }
  .profile-information { min-width: 0; }
  .profile-name { font-size: 22px; margin: 0 0 12px; }
  .profile-links li + li { margin-top: 5px; }
  .profile-links a { font-size: 13px; gap: 7px; }
  .content-section { min-height: 106px; }
  .content-section h2 { font-size: 21px; }
}
@media (max-width: 350px) {
  .profile { gap: 15px; }
  .profile-avatar { flex-basis: 78px; width: 78px; height: 78px; }
  .profile-name { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

</style>

<script>
"use strict";

const navigation = document.querySelector(".navigation");
const toggle = document.querySelector(".menu-toggle");
const navigationLinks = [...document.querySelectorAll(".navigation-links a")];

if (navigation && toggle) {
  toggle.hidden = false;
  navigation.classList.add("menu-ready");

  const closeMenu = () => {
    navigation.classList.remove("menu-open");
    toggle.setAttribute("aria-expanded", "false");
    toggle.setAttribute("aria-label", "Open navigation");
  };

  toggle.addEventListener("click", () => {
    const isOpen = navigation.classList.toggle("menu-open");
    toggle.setAttribute("aria-expanded", String(isOpen));
    toggle.setAttribute("aria-label", isOpen ? "Close navigation" : "Open navigation");
  });

  navigationLinks.forEach((link) => {
    link.addEventListener("click", closeMenu);
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && navigation.classList.contains("menu-open")) {
      closeMenu();
      toggle.focus();
    }
  });

  window.matchMedia("(max-width: 760px)").addEventListener("change", closeMenu);
}

const updateActiveSection = () => {
  const activeHash = window.location.hash || "#about-me";
  navigationLinks.forEach((link) => {
    if (link.hash === activeHash) {
      link.setAttribute("aria-current", "location");
    } else {
      link.removeAttribute("aria-current");
    }
  });
};

window.addEventListener("hashchange", updateActiveSection);
updateActiveSection();

const year = document.getElementById("copyright-year");
if (year) year.textContent = String(new Date().getFullYear());

</script>
